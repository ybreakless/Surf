[package]
name = "Surf"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.37.0"
egui = "0.37.0"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "uuid"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
regex = "1.11"
image = { version = "0.25.10", features = ["png", "jpeg"] }

[profile.release]
lto = true
